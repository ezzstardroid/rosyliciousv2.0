<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f5fb"><title>Rosylicious v0.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,serif;color:#806d8b;background:#f8f5fb}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
#intro,#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#fff,#f8f3fb 65%,#eee5f4);z-index:30}.core{position:relative;width:96vw;height:72vh;display:grid;place-items:center}.brand{z-index:2;text-align:center;opacity:0;animation:show 1.5s 2s forwards}.brand h1{font-size:clamp(30px,8vw,68px);font-weight:400;letter-spacing:.12em;margin:0}.brand p{font:10px Arial;letter-spacing:.35em}.wing{position:absolute;top:50%;width:49%;height:58%;opacity:0;filter:drop-shadow(0 12px 12px #d9cce355)}.left{left:0;transform-origin:right;animation:leftwing 2.5s .1s forwards}.right{right:0;transform-origin:left;animation:rightwing 2.5s .1s forwards}.feather{position:absolute;width:82%;height:16%;border-radius:100% 8% 100% 12%;background:linear-gradient(100deg,#fff,#fff 50%,#e9e0ef);box-shadow:inset 0 -3px 5px #e8deed}.left .feather{left:5%;transform-origin:right}.right .feather{left:13%;transform-origin:left}.feather:nth-child(1){top:5%;width:67%;transform:rotate(-29deg)}.feather:nth-child(2){top:19%;width:79%;transform:rotate(-18deg)}.feather:nth-child(3){top:33%;width:91%;transform:rotate(-7deg)}.feather:nth-child(4){top:47%;width:94%;transform:rotate(5deg)}.feather:nth-child(5){top:61%;width:83%;transform:rotate(16deg)}.feather:nth-child(6){top:74%;width:69%;transform:rotate(26deg)}.right .feather{transform:scaleX(-1) rotate(-8deg)}.right .feather:nth-child(1){transform:scaleX(-1) rotate(-29deg)}.right .feather:nth-child(2){transform:scaleX(-1) rotate(-18deg)}.right .feather:nth-child(3){transform:scaleX(-1) rotate(-7deg)}.right .feather:nth-child(4){transform:scaleX(-1) rotate(5deg)}.right .feather:nth-child(5){transform:scaleX(-1) rotate(16deg)}.right .feather:nth-child(6){transform:scaleX(-1) rotate(26deg)}
@keyframes leftwing{0%{opacity:0;transform:translateY(-50%) scaleX(.04) rotateY(80deg)}25%{opacity:1}68%{transform:translate(-2%,-50%) scaleX(1.04) rotate(-4deg)}100%{opacity:1;transform:translateY(-50%) scaleX(1)}}@keyframes rightwing{0%{opacity:0;transform:translateY(-50%) scaleX(.04) rotateY(-80deg)}25%{opacity:1}68%{transform:translate(2%,-50%) scaleX(1.04) rotate(4deg)}100%{opacity:1;transform:translateY(-50%) scaleX(1)}}@keyframes show{to{opacity:1}}
.intro-actions{position:absolute;bottom:26px;display:flex;gap:10px}.soft-btn{background:#ffffffc9;border:1px solid white;padding:12px 20px;border-radius:30px;font:11px Arial;letter-spacing:.12em}
#boot{display:none;z-index:25;text-align:center}.boot-inner{font:12px Arial;letter-spacing:.2em}.boot-wings{font-size:30px;letter-spacing:10px;margin-bottom:18px}.boot-wings span{display:inline-block;animation:pulse 1.1s infinite}.boot-wings span:nth-child(2){animation-delay:.25s}.boot-wings span:nth-child(3){animation-delay:.5s}@keyframes pulse{0%,100%{opacity:.3;transform:translateY(3px) scale(.9)}50%{opacity:1;transform:translateY(-3px) scale(1.08)}}
#phone{display:none;position:fixed;inset:0;background:linear-gradient(150deg,#fff,#eee6f3)}.status{height:38px;padding:10px 19px 0;display:flex;justify-content:space-between;font:12px Arial}.home{height:calc(100% - 38px);padding:25px 22px 23px;display:flex;flex-direction:column}.home-head{display:flex;justify-content:space-between}.home-head h2{font-size:25px;font-weight:400;margin:0}.date-line{font:12px Arial;color:#a494ae;margin-top:7px}.version{font:10px Arial;color:#aa9bb4}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px 10px;margin-top:43px}.app{display:flex;flex-direction:column;align-items:center;gap:8px;background:none}.icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#fff,#eee5f4);box-shadow:0 8px 20px #cfc1d988;display:grid;place-items:center;font-size:28px;border:1px solid white}.app small{font:11px Arial;color:#75627f;text-align:center}.dock{margin-top:auto;display:flex;justify-content:center;gap:17px;padding:12px;background:#ffffff91;border:1px solid white;border-radius:25px}.dock .icon{width:48px;height:48px;border-radius:16px;font-size:23px}
#appWindow{position:absolute;inset:38px 0 0;background:linear-gradient(150deg,#fff,#f7f2fa);display:none;animation:pop .28s}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}.appbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eadff0;background:#ffffffc9}.appbar strong{font-size:18px;font-weight:400}.window-controls{display:flex;gap:7px}.window-controls button{width:34px;height:32px;border-radius:12px;background:#f0e9f4;font:17px Arial}.app-content{height:calc(100% - 58px);overflow:auto;padding:18px 17px 30px}.panel{background:#ffffffd9;border:1px solid white;border-radius:21px;padding:17px;box-shadow:0 8px 24px #d9cde244;margin-bottom:14px}.panel h3{font-size:20px;font-weight:400;margin:0 0 9px}.panel p{font:13px/1.6 Arial;color:#93849d}.primary,.game-btn{background:linear-gradient(120deg,#e6d9ed,#f4edf7);padding:13px 16px;border-radius:16px;font:12px Arial;letter-spacing:.06em;margin:5px 0}.game-btn{width:100%;color:#806d8b}.telegram{color:#8b78a0;text-decoration:none;font:14px Arial}.price-list{width:100%;border-collapse:collapse;font:13px Arial}.price-list td{padding:9px 4px;border-bottom:1px solid #eadff0}.price-list td:last-child{text-align:right;font-weight:bold}.calc-input,.pet-name{width:100%;padding:13px;border:1px solid #eadff0;border-radius:14px;background:white;font:16px Arial;margin:8px 0}.calc-result{font:20px Georgia;padding:12px 0}.credit-line{font:13px Arial;line-height:2;color:#887994}.setting-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eadff0}
#appLoader{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#f1eaf6);z-index:4;display:none;place-items:center;text-align:center}.loader-symbol{font-size:27px;letter-spacing:8px;animation:pulse 1.1s infinite}.loader-label{font:11px Arial;letter-spacing:.2em;margin-top:15px;color:#9d8aaa}.game-menu{text-align:center}.pet-display{text-align:center;padding:20px;background:linear-gradient(145deg,#fff,#f0e9f5);border-radius:22px}.pet-emoji{font-size:83px;margin:12px}.pet-stat{background:#eee5f5;height:10px;border-radius:20px;overflow:hidden;margin:8px 0 13px}.pet-stat div{height:100%;background:#c7afd8;border-radius:20px}.stat-label{display:flex;justify-content:space-between;font:12px Arial;color:#95849f}.game-field{height:min(52vh,410px);min-height:280px;position:relative;overflow:hidden;background:linear-gradient(#fff,#eee6f5);border-radius:22px;border:1px solid #e5d9ed}.angel-player{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:43px;z-index:2}.hazard{position:absolute;top:-38px;font:bold 13px Arial;color:#987da9;background:white;border:1px solid #eee4f3;border-radius:12px;padding:9px 11px;box-shadow:0 3px 8px #d7c9e0}.game-controls{display:flex;gap:8px;margin-top:10px}.game-controls button{flex:1;padding:13px;background:#eee5f5;border-radius:15px}.game-note{font:11px Arial;color:#a092a9;text-align:center}
@media(max-width:380px){.home{padding:20px 17px}.apps{margin-top:33px;gap:18px 7px}.icon{width:57px;height:57px}}
</style></head><body>
<section id="intro"><div class="core">
<div class="wing left"><i class="feather"></i><i class="feather"></i><i class="feather"></i><i class="feather"></i><i class="feather"></i><i class="feather"></i></div>
<div class="wing right"><i class="feather"></i><i class="feather"></i><i class="feather"></i><i class="feather"></i><i class="feather"></i><i class="feather"></i></div>
<div class="brand"><h1>Rosylicious.</h1><p>AN ANGELIC LITTLE WORLD</p></div></div>
<div class="intro-actions"><button class="soft-btn" onclick="startBoot()">ENTER ✧</button><button class="soft-btn" onclick="startBoot()">SKIP</button></div></section>
<section id="boot"><div class="boot-inner"><div class="boot-wings"><span>🪽</span><span>🪽</span><span>🪽</span></div>LOADING ROSYLICIOUS</div></section>
<main id="phone"><div class="status"><span id="clock">--:--</span><span>◈ Wi-Fi　▰</span></div>
<section class="home"><div class="home-head"><div><h2>Rosylicious</h2><div class="date-line" id="dateLine"></div></div><span class="version">v0.3</span></div>
<div class="apps">
<button class="app" onclick="openApp('shop')"><span class="icon">🪽</span><small>Rosylicious</small></button>
<button class="app" onclick="openApp('telegram')"><span class="icon">💌</span><small>Telegram</small></button>
<button class="app" onclick="openApp('calculator')"><span class="icon">🧮</span><small>RosyCalculator</small></button>
<button class="app" onclick="openApp('credit')"><span class="icon">✧</span><small>Credit</small></button>
<button class="app" onclick="openApp('settings')"><span class="icon">⚙️</span><small>Settings</small></button>
<button class="app" onclick="openApp('games')"><span class="icon">🎮</span><small>RosyGames</small></button></div>
<div class="dock"><button class="app" onclick="openApp('shop')"><span class="icon">🪽</span></button><button class="app" onclick="openApp('telegram')"><span class="icon">💌</span></button><button class="app" onclick="openApp('calculator')"><span class="icon">🧮</span></button></div></section>
<section id="appWindow"><header class="appbar"><strong id="appTitle">App</strong><div class="window-controls"><button onclick="goHome()" title="Home">⌂</button><button onclick="goHome()" title="Back">‹</button><button onclick="goHome()" title="Window">▢</button></div></header><div class="app-content" id="appContent"></div><div id="appLoader"><div><div class="loader-symbol">🪽 🪽 🪽</div><div class="loader-label">OPENING APP...</div></div></div></section></main>
<script>
const $=id=>document.getElementById(id);
function updateClock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('dateLine').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});}updateClock();setInterval(updateClock,1000);
let audioCtx;
function wingSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const dur=.35,len=Math.floor(audioCtx.sampleRate*dur),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len)*.2;const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=850;g.gain.value=.5;src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start();}catch(e){}}
function startBoot(){wingSound();$('intro').style.display='none';$('boot').style.display='grid';setTimeout(()=>{$('boot').style.display='none';$('phone').style.display='block';},2600);}
const titles={shop:'Rosylicious',telegram:'Telegram',calculator:'RosyCalculator',credit:'Credit',settings:'Settings',games:'RosyGames'};
function openApp(name){stopDodge();$('appTitle').textContent=titles[name];$('appContent').innerHTML='';$('appWindow').style.display='block';$('appLoader').style.display='grid';setTimeout(()=>{$('appContent').innerHTML=pages[name]();$('appLoader').style.display='none';},750);}
function goHome(){stopDodge();$('appWindow').style.display='none';}
const priceRows=Array.from({length:50},(_,i)=>`<tr><td>RM${i+1}</td><td>${((i+1)*20).toLocaleString()} Robux</td></tr>`);
const pages={
shop:()=>`<div class="panel" style="text-align:center"><div style="font-size:45px">🪽</div><h3>Welcome to Rosylicious</h3><p>Your little angelic store. Elegant finds and a touch of heaven.</p><button class="primary" onclick="openApp('calculator')">VIEW PRICE LIST</button></div><div class="panel"><h3>Rosylicious Store</h3><p>All questions and purchase enquiries should be asked in our Telegram group.</p><a class="telegram" href="https://t.me/rosyliciousstore" target="_blank">💌 Open Telegram group ↗</a></div>`,
telegram:()=>`<div class="panel" style="text-align:center"><div style="font-size:40px">💌</div><h3>Rosylicious Telegram</h3><p>Segala pertanyaan dan urusan pembelian harus ditanya di dalam group.</p><a class="telegram" href="https://t.me/rosyliciousstore" target="_blank">t.me/rosyliciousstore ↗</a></div>`,
calculator:()=>`<div class="panel"><h3>RosyCalculator</h3><p>Masukkan jumlah RM untuk kira Robux.</p><input class="calc-input" id="rmInput" type="number" min="0" step="0.01" placeholder="Enter RM amount" oninput="calculatePrice()"><div class="calc-result" id="calcResult">RM1 = 20 Robux</div><p>Rate: RM1 = 20 Robux</p></div><div class="panel"><h3>Custom Price List</h3><table class="price-list">${priceRows.join('')}</table></div>`,
credit:()=>`<div class="panel" style="text-align:center"><div style="font-size:40px">✧</div><h3>Credits</h3><div class="credit-line">MAKER<br><b>SYAIEZz</b><br><br>OWNER OF ROSYLICIOUS<br><b>@wrraedeiia</b><br><br>Rosylicious v0.3</div></div>`,
settings:()=>`<div class="panel"><h3>Settings</h3><div class="setting-row"><span>Device time</span><b>Automatic</b></div><div class="setting-row"><span>Theme</span><b>Angelic White</b></div><div class="setting-row"><span>Version</span><b>v0.3</b></div><div class="setting-row"><span>Intro sound</span><b>Wing flap</b></div></div>`,
games:()=>`<div class="panel game-menu"><div style="font-size:39px">🪽</div><h3>RosyGames</h3><p>Welcome to your angelic playground!</p><button class="game-btn" onclick="startPet()">🐱 ROSYPET</button><button class="game-btn" onclick="startDodge()">🪽 ANGEL DODGE</button></div><p class="game-note">Choose a game to begin ✧</p>`
};
function calculatePrice(){const v=parseFloat($('rmInput').value);$('calcResult').textContent=Number.isFinite(v)&&v>=0?`RM${v.toLocaleString('en-MY')} = ${(v*20).toLocaleString('en-MY',{maximumFractionDigits:2})} Robux`:'Enter a valid RM amount';}
let pet={type:'cat',name:'Angel',hunger:80,happy:90,energy:100};
const petTypes={cat:{emoji:'🐱🪽',food:'Fish',foodEmoji:'🐟'},bunny:{emoji:'🐰🪽',food:'Carrot',foodEmoji:'🥕'},dog:{emoji:'🐶🪽',food:'Dog food',foodEmoji:'🦴'}};
function randomPet(){const types=['cat','bunny','dog'];pet.type=types[Math.floor(Math.random()*3)];pet.name='Angel';pet.hunger=80;pet.happy=90;pet.energy=100;}
function startPet(){stopDodge();randomPet();showPet();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showPet(){const p=petTypes[pet.type];$('appContent').innerHTML=`<div class="pet-display"><div class="pet-emoji">${p.emoji}</div><h3>${esc(pet.name)}</h3><input class="pet-name" id="petName" maxlength="15" placeholder="Give your pet a name"><button class="game-btn" onclick="renamePet()">SAVE NAME</button><div class="stat-label"><span>Hunger</span><b>${pet.hunger}%</b></div><div class="pet-stat"><div style="width:${pet.hunger}%"></div></div><div class="stat-label"><span>Happiness</span><b>${pet.happy}%</b></div><div class="pet-stat"><div style="width:${pet.happy}%"></div></div><div class="stat-label"><span>Energy</span><b>${pet.energy}%</b></div><div class="pet-stat"><div style="width:${pet.energy}%"></div></div><button class="game-btn" onclick="feedPet()">${p.foodEmoji} FEED ${p.food.toUpperCase()}</button><button class="game-btn" onclick="playPet()">✨ PLAY WITH PET</button><button class="game-btn" onclick="sleepPet()">🌙 LET PET SLEEP</button><button class="game-btn" onclick="startPet()">🎲 REROLL PET</button></div>`;}
function renamePet(){const v=$('petName').value.trim();if(v)pet.name=v;showPet();}
function feedPet(){pet.hunger=Math.min(100,pet.hunger+25);pet.happy=Math.min(100,pet.happy+5);showPet();}
function playPet(){if(pet.energy>=10){pet.happy=Math.min(100,pet.happy+15);pet.energy-=10;pet.hunger=Math.max(0,pet.hunger-5);}showPet();}
function sleepPet(){pet.energy=100;showPet();}
let playerPosition=50,score=0,dodgeRunning=false,gameTimer=null,hazardTimer=null,activeHazards=[],blocking=false,blockTimeout=null;
function stopDodge(){dodgeRunning=false;clearInterval(gameTimer);clearInterval(hazardTimer);activeHazards.forEach(clearInterval);activeHazards=[];clearTimeout(blockTimeout);blocking=false;}
function startDodge(){stopDodge();score=0;playerPosition=50;$('appContent').innerHTML=`<div class="panel"><h3>🪽 Angel Dodge</h3><p>Elak serangan perkataan yang datang. Jangan terkena!</p><h3 id="dodgeScore">Score: 0</h3><div class="game-field" id="field"><div class="angel-player" id="player">👼</div></div><div class="game-controls"><button onclick="moveAngel(-1)">◀ LEFT</button><button onclick="moveAngel(1)">RIGHT ▶</button></div><button class="game-btn" onclick="blockAngel()">🛡️ BLOCK</button><button class="game-btn" onclick="startDodge()">↻ RESTART</button><p class="game-note">Keyboard: ← → or A / D. Block gives a brief shield.</p></div>`;dodgeRunning=true;hazardTimer=setInterval(createHazard,850);gameTimer=setInterval(()=>{if(!dodgeRunning)return;score++;const el=$('dodgeScore');if(el)el.textContent='Score: '+score;},1000);}
function moveAngel(dir){if(!dodgeRunning)return;playerPosition=Math.max(8,Math.min(92,playerPosition+dir*9));const p=$('player');if(p)p.style.left=playerPosition+'%';}
function blockAngel(){if(!dodgeRunning)return;blocking=true;const p=$('player');if(p)p.textContent='🛡️';clearTimeout(blockTimeout);blockTimeout=setTimeout(()=>{blocking=false;if(dodgeRunning&&$('player'))$('player').textContent='👼';},650);}
function createHazard(){if(!dodgeRunning)return;const field=$('field');if(!field)return;const words=['SCAM','PENIPU','SPAM','BLOCK'],item=document.createElement('div');item.className='hazard';item.textContent=words[Math.floor(Math.random()*words.length)];item.style.left=(Math.random()*76+5)+'%';field.appendChild(item);let y=-40;const speed=2.1+Math.min(score/35,3.5);const move=setInterval(()=>{if(!dodgeRunning||!item.isConnected){clearInterval(move);return;}y+=speed;item.style.top=y+'px';const p=$('player');if(!p){clearInterval(move);item.remove();return;}const a=item.getBoundingClientRect(),b=p.getBoundingClientRect(),hit=a.bottom>b.top+8&&a.top<b.bottom&&a.right>b.left&&a.left<b.right;if(hit){clearInterval(move);item.remove();if(!blocking)endDodge();return;}if(y>field.clientHeight){clearInterval(move);item.remove();}},25);activeHazards.push(move);}
function endDodge(){stopDodge();const field=$('field');if(field)field.innerHTML=`<div style="text-align:center;padding:75px 12px"><div style="font-size:52px">🪽</div><h3>Game Over</h3><p>Your score: ${score}</p><button class="game-btn" onclick="startDodge()">PLAY AGAIN</button></div>`;}
document.addEventListener('keydown',e=>{if(!dodgeRunning)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();moveAngel(-1)}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();moveAngel(1)}});
</script></body></html>
